apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaapp
  namespace: javaapp
  labels:
    app: javaapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: javaapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: javaapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: javaapp
          # Replaced by the Ansible playbook with the exact SHA-tagged image on every deploy.
          # Edit OWNER/REPO (lowercase) if you apply this file by hand.
          image: ghcr.io/OWNER/REPO:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
